name: privacyguard
description: PrivacyGuard — cross-platform privacy monitor

publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  # Navigation
  go_router: ^12.0.0
  # Charts
  fl_chart: ^0.65.0
  # Platform channels
  plugin_platform_interface: ^2.0.0
  # Utilities
  intl: ^0.18.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^3.0.0

flutter:
  module:
    androidX: true
    androidPackage: com.privacyguard.app
    iosBundleIdentifier: com.privacyguard.app
  uses-material-design: true
