# ─────────────────────────────────────────────────────────────────────────────
# PrivacyGuard release signing configuration
#
# Copy this file to release-signing.local.properties (gitignored),
# fill in the values, then run:
#   ./gradlew assembleConsumerRelease
#   ./gradlew bundleConsumerRelease      # for Play Store AAB
#
# To generate a new keystore (one-time):
#   keytool -genkey -v \
#     -keystore privacyguard-release.jks \
#     -alias privacyguard \
#     -keyalg RSA -keysize 4096 \
#     -validity 10000 \
#     -dname "CN=PrivacyGuard, OU=Mobile, O=YourOrg, L=City, S=State, C=US"
#
# To get the SHA-256 fingerprint for PRIVACYGUARD_RELEASE_SIGNATURE_SHA256:
#   keytool -list -v -keystore privacyguard-release.jks -alias privacyguard \
#     | grep "SHA256:" | awk '{print $2}' | tr -d ':'
# ─────────────────────────────────────────────────────────────────────────────

# Absolute or project-relative path to the .jks / .keystore file
PRIVACYGUARD_RELEASE_STORE_FILE=../privacyguard-release.jks

# Keystore password (set when running keytool -genkey)
PRIVACYGUARD_RELEASE_STORE_PASSWORD=

# Key alias (the -alias value given to keytool)
PRIVACYGUARD_RELEASE_KEY_ALIAS=privacyguard

# Key password (usually same as store password for new keystores)
PRIVACYGUARD_RELEASE_KEY_PASSWORD=

# SHA-256 fingerprint of the signing cert (no colons, uppercase hex)
# Used by BuildConfig.APP_SIGNATURE_SHA256 for certificate pinning checks
PRIVACYGUARD_RELEASE_SIGNATURE_SHA256=
