[workspace]
members = [
    "privacyguard-core",
    "privacyguard-linux",
    "privacyguard-windows",
    "privacyguard-ebpf",
]
# Built only by `cargo fuzz` (nightly); see privacyguard-core/fuzz.
exclude = ["privacyguard-core/fuzz"]
resolver = "2"

[workspace.dependencies]
tokio  = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap   = { version = "4", features = ["derive"] }
serde  = { version = "1", features = ["derive"] }
serde_json = "1"

# Profiles only take effect here, at the workspace root: Cargo ignored the ones in
# the member manifests, so release builds had neither LTO nor panic = "abort" (R-2).
# panic = "abort": a panic must not unwind across the JNI / C boundary.
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = "symbols"
