[workspace]
members = [
    "privacyguard-core",
    "privacyguard-linux",
    "privacyguard-windows",
    "privacyguard-ebpf",
]
resolver = "2"

[workspace.dependencies]
tokio  = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap   = { version = "4", features = ["derive"] }
serde  = { version = "1", features = ["derive"] }
serde_json = "1"
