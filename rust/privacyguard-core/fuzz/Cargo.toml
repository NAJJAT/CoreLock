[package]
name = "privacyguard-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
privacyguard-core = { path = "..", default-features = false }

# Not part of the rust/ workspace: built only by `cargo fuzz` (nightly).
[workspace]
members = ["."]

[[bin]]
name = "classify_packet"
path = "fuzz_targets/classify_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ja3"
path = "fuzz_targets/ja3.rs"
test = false
doc = false
bench = false
