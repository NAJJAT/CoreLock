# Release integrity (plan task 2.4). Runs when the owner publishes a release, after the
# owner built and signed the APK on their own machine (CLAUDE.md §12: the signing key
# never comes to GitHub). It:
#   1. checks every APK on the release is signed with the key whose SHA-256 fingerprint
#      is in the README at that tag, and fails loudly if not;
#   2. checks the release text names each APK's SHA-256 (the owner copies it in by hand);
#   3. makes SHA256SUMS.txt (for `sha256sum -c`) as a run artifact; the owner attaches it
#      to the release.
# Read-only (owner, 2026-11-05: write access only for the nightly issue and the
# malware-snapshot PR). It never builds, signs, uploads to or edits the release. GitHub artifact
# attestations are not made here: an attestation says "this workflow built this file",
# and this workflow doesn't build the APK. See docs/RELEASE_CHECKLIST.md, "Attestations".
name: Release checks

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check again (e.g. v1.2.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read         # download the release's APKs and read its text
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Download the release's APKs
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/release"
          ls -l "$RUNNER_TEMP/release"
          ls "$RUNNER_TEMP/release"/*.apk > /dev/null || { echo "::error::No APK on release $TAG"; exit 1; }

      - name: Signer matches the README fingerprint
        run: |
          # The fingerprint is the only 64-hex line in the code block under "Release signing
          # certificate (SHA-256)" in the README of this tag.
          expected=$(awk '/Release signing certificate \(SHA-256\)/{f=1} f && /^[0-9a-f]{64}$/{print; exit}' README.md)
          [ -n "$expected" ] || { echo "::error::No signing fingerprint found in README.md"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in "$RUNNER_TEMP/release"/*.apk; do
            out=$("$bt/apksigner" verify --print-certs "$apk") || { echo "::error::$(basename "$apk"): signature does not verify"; exit 1; }
            signers=$(echo "$out" | grep -c 'certificate SHA-256 digest' || true)
            got=$(echo "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [ "$signers" = "1" ] || { echo "::error::$(basename "$apk"): expected one signer, found $signers"; exit 1; }
            [ "$got" = "$expected" ] || { echo "::error::$(basename "$apk") is signed with $got, not the README key $expected"; exit 1; }
            echo "$(basename "$apk"): signed with the README key"
          done

      - name: Checksums, checked against the release text
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          missing=0
          while read -r sum file; do
            if ! printf '%s' "$body" | grep -qi "$sum"; then
              echo "::error::The release text does not show the SHA-256 of $file ($sum)"
              missing=1
            fi
          done < SHA256SUMS.txt
          exit $missing

      - name: Keep SHA256SUMS.txt for the owner to attach
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS-${{ env.TAG }}
          path: ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: ignore
