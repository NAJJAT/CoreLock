name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (a tag can be moved to other code);
# the comment names the release. Dependabot's github-actions updates bump both.

jobs:
  android:
    name: Unit tests, lint and R8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Unit tests (consumer + enterprise)
        run: ./gradlew --no-daemon :app:testConsumerDebugUnitTest :app:testEnterpriseDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintConsumerDebug :app:lintEnterpriseDebug

      # Shrinks both release variants, so a keep rule that R8 needs but the debug
      # build never exercises fails here rather than in a user's hands. (R8 runs
      # without a signing key; only the signed artifact tasks need one.)
      - name: R8 (release shrinking)
        run: ./gradlew --no-daemon :app:minifyConsumerReleaseWithR8 :app:minifyEnterpriseReleaseWithR8

      # Proves release builds refuse to fall back to the debug key (finding H-3).
      - name: Unsigned release must fail
        run: |
          if ./gradlew --no-daemon :app:assembleConsumerRelease --dry-run; then
            echo "::error::assembleConsumerRelease succeeded without release signing"
            exit 1
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: app/build/reports

  instrumented:
    name: Room migration and instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Every migration is checked against the exported schemas (app/schemas).
      - name: Instrumented tests (enterprise covers the shared code too)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedEnterpriseDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-reports
          path: app/build/reports

  # Known vulnerabilities (OSV database) in what ships: the release APKs' runtime
  # libraries. Fails on any finding not excused, with a reason and an end date, in an
  # osv-scanner.toml next to the scanned file.
  dependencies:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: List the release APKs' libraries
        run: ./gradlew --no-daemon :app:osvLockfile

      # Pinned like the actions: a release binary checked against its SHA-256.
      - name: Install osv-scanner
        env:
          OSV_VERSION: v2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Scan
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source \
            -L app/build/osv/gradle.lockfile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
