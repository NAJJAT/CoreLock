version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]

  - package-ecosystem: cargo
    directory: "/rust/privacyguard-core"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
